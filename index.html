<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Praesidium is a sci-fi tower defense web game with campaign levels, endless waves, seeded challenges, talents, achievements, Intel Codex, and bilingual UI." />
    <meta name="keywords" content="Praesidium, tower defense, browser game, canvas game, TypeScript game, sci-fi tower defense" />
    <meta name="author" content="Lunora-Gather" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://lunora-gather.github.io/Praesidium/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23060a0f'/><circle cx='16' cy='16' r='8' fill='none' stroke='%233b82f6' stroke-width='3'/><circle cx='16' cy='16' r='3' fill='%233b82f6'/></svg>" />
    <meta property="og:site_name" content="Lunora Gather" />
    <meta property="og:title" content="Praesidium — Sci-Fi Tower Defense" />
    <meta property="og:description" content="Build, upgrade, cast spells, unlock talents, and defend ten themed campaign zones or endless seeded challenges." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lunora-gather.github.io/Praesidium/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Praesidium — Sci-Fi Tower Defense" />
    <meta name="twitter:description" content="A polished browser tower defense game with campaign progression, Intel Codex, achievements, talents, and endless challenges." />
    <title>Praesidium — Sci-Fi Tower Defense</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: #060a0f;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #c {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        touch-action: none;
      }
      #game-controls, #game-controls button {
        position: fixed;
        pointer-events: none;
      }
      #game-controls { inset: 0; }
      #game-controls button {
        appearance: none;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
      }
      #game-controls button:focus-visible {
        outline: 2px solid #e0f2fe;
        outline-offset: 2px;
        box-shadow: 0 0 0 5px #1d4ed8;
      }
      #challenge-dialog, .app-dialog {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(420px, calc(100% - 32px));
        max-height: calc(100% - 32px);
        padding: 22px;
        color: #e2e8f0;
        background: #101b30;
        border: 1px solid #436291;
        border-radius: 14px;
      }
      #challenge-dialog::backdrop { background: rgba(2, 6, 23, .78); }
      #challenge-dialog form { display: grid; gap: 12px; }
      #challenge-dialog h2 { color: #f8fafc; font-size: 21px; }
      #challenge-dialog p { font-size: 14px; line-height: 1.4; }
      #challenge-dialog input, #challenge-dialog button {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #516484;
        border-radius: 8px;
        background: #16243a;
        color: #f8fafc;
        font: inherit;
      }
      #challenge-dialog input { min-width: 0; font: 16px ui-monospace, monospace; }
      #challenge-dialog :focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
      #challenge-dialog input[aria-invalid="true"] { border-color: #fda4af; }
      #challenge-status { min-height: 1.4em; color: #fecdd3; }
      #challenge-dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
      #challenge-dialog button[type="submit"] { background: #1d4ed8; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden;
        white-space: nowrap; clip-path: inset(50%);
      }
      .ops-dialog { width: min(540px, calc(100% - 24px)); overflow: hidden; }
      .ops-dialog[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
      .ops-content { min-height: 0; overflow: auto; overscroll-behavior: contain; padding-right: 5px; }
      .ops-dialog .actions { padding-top: 10px; border-top: 1px solid #334155; }
      .ops-dialog h3 { font-size: 15px; margin: 16px 0 7px; color: #a5f3fc; }
      .ops-dialog ul { margin: 0 0 6px; padding-left: 21px; font-size: 13px; line-height: 1.6; }
      .app-dialog::backdrop { background: rgba(2, 6, 23, .78); }
      .app-dialog h2 { color: #f8fafc; font-size: 21px; margin-bottom: 12px; }
      .app-dialog p { font-size: 14px; line-height: 1.45; }
      .app-dialog .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      .app-dialog button, #progress-notice {
        min-height: 44px; padding: 8px 12px; border: 1px solid #516484;
        border-radius: 8px; background: #16243a; color: #f8fafc; font: inherit;
      }
      .app-dialog :focus-visible, #progress-notice:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
      #progress-notice {
        position: fixed; left: 50%; bottom: 8px; z-index: 3; transform: translateX(-50%);
        width: max-content; max-width: calc(100% - 16px); color: #fef3c7;
        background: #302019; border-color: #b45309; font-size: 13px;
      }
      #boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
        gap: 12px;
        color: #dbeafe;
        background: radial-gradient(circle at 50% 38%, rgba(37, 99, 235, 0.18), transparent 34%), #060a0f;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      #boot-loading strong {
        color: #ffffff;
        font-size: 22px;
        letter-spacing: 0;
      }
      #boot-loading span {
        color: #93c5fd;
        font-size: 13px;
      }
      #err {
        position: fixed; inset: 0;
        display: none;
        flex-direction: column;
        align-items: center; justify-content: center;
        background: rgba(0,0,0,0.96);
        color: #f87171;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        padding: 40px;
        z-index: 9999;
        gap: 16px;
        text-align: center;
      }
      #err h2 { color: #fca5a5; font-size: 22px; font-family: sans-serif; }
      #err pre { max-width: 80vw; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
      #err button {
        margin-top: 8px; padding: 10px 28px;
        background: #3b82f6; color: #fff;
        border: none; border-radius: 8px;
        font-size: 14px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="c" aria-hidden="true"></canvas>
    <div id="game-controls" role="group"></div>
    <div id="battle-status" class="sr-only" role="region" hidden></div>
    <div id="game-reading" class="sr-only" role="region" hidden></div>
    <p id="game-announcement" class="sr-only" role="status"></p>
    <dialog id="challenge-dialog" aria-labelledby="challenge-title">
      <form>
        <h2 id="challenge-title"></h2>
        <label id="challenge-label" for="challenge-code"></label>
        <input id="challenge-code" aria-describedby="challenge-status" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64" />
        <p id="challenge-status" role="status"></p>
        <div class="actions">
          <button id="challenge-close" type="button"></button>
          <button id="challenge-submit" type="submit"></button>
        </div>
      </form>
    </dialog>
    <div id="boot-loading" aria-live="polite">
      <strong>Praesidium</strong>
      <span>Loading defense grid...</span>
    </div>
    <div id="err">
      <h2>⚠ Praesidium crashed</h2>
      <pre id="err-msg">Unknown error</pre>
      <button onclick="location.reload()">Reload</button>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('err');
        var msg = document.getElementById('err-msg');
        if (!el || !msg) return;
        msg.textContent = (e.error && e.error.stack) || e.message || 'Unknown error';
        el.style.display = 'flex';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('err');
        var msg = document.getElementById('err-msg');
        if (!el || !msg) return;
        msg.textContent = (e.reason && e.reason.stack) || String(e.reason) || 'Promise rejected';
        el.style.display = 'flex';
      });
    </script>
    <script type="module">
      if (import.meta.env.PROD && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function(error) {
          console.warn('[Praesidium] Service Worker unavailable:', error);
        });
      }
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
