    <style>*,:before,:after{box-sizing:border-box;margin:0;padding:0}html,body{background:#060a0f;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;overflow:hidden}#c{cursor:crosshair;touch-action:none;width:100vw;height:100vh;display:block}#game-controls,#game-controls button{pointer-events:none;position:fixed}#game-controls{top:0;bottom:0;left:0;right:0}#game-controls button{-webkit-appearance:none;appearance:none;background:0 0;border:0;border-radius:5px;padding:0}#game-controls button:focus-visible{outline-offset:2px;outline:2px solid #e0f2fe;box-shadow:0 0 0 5px #1d4ed8}#challenge-dialog,.app-dialog{color:#e2e8f0;background:#101b30;border:1px solid #436291;border-radius:14px;width:min(420px,100% - 32px);max-height:calc(100% - 32px);margin:auto;padding:22px;position:fixed;top:0;bottom:0;left:0;right:0}#challenge-dialog::backdrop{background:#020617c7}#challenge-dialog form{gap:12px;display:grid}#challenge-dialog h2{color:#f8fafc;font-size:21px}#challenge-dialog p{font-size:14px;line-height:1.4}#challenge-dialog input,#challenge-dialog button{color:#f8fafc;min-height:44px;font:inherit;background:#16243a;border:1px solid #516484;border-radius:8px;padding:8px 12px}#challenge-dialog input{min-width:0;font:16px ui-monospace,monospace}#challenge-dialog :focus-visible{outline-offset:2px;outline:2px solid #93c5fd}#challenge-dialog input[aria-invalid=true]{border-color:#fda4af}#challenge-status{color:#fecdd3;min-height:1.4em}#challenge-dialog .actions{justify-content:flex-end;gap:8px;display:flex}#challenge-dialog button[type=submit]{background:#1d4ed8}.sr-only{white-space:nowrap;clip-path:inset(50%);width:1px;height:1px;margin:-1px;position:absolute;overflow:hidden}.ops-dialog{width:min(540px,100% - 24px);overflow:hidden}.ops-dialog[open]{grid-template-rows:auto minmax(0,1fr) auto;display:grid}.ops-content{overscroll-behavior:contain;min-height:0;padding-right:5px;overflow:auto}.ops-dialog .actions{border-top:1px solid #334155;padding-top:10px}.ops-dialog h3{color:#a5f3fc;margin:16px 0 7px;font-size:15px}.ops-dialog ul{margin:0 0 6px;padding-left:21px;font-size:13px;line-height:1.6}.app-dialog::backdrop{background:#020617c7}.app-dialog h2{color:#f8fafc;margin-bottom:12px;font-size:21px}.app-dialog p{font-size:14px;line-height:1.45}.app-dialog .actions{flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px;display:flex}.app-dialog button,#progress-notice{color:#f8fafc;min-height:44px;font:inherit;background:#16243a;border:1px solid #516484;border-radius:8px;padding:8px 12px}.app-dialog :focus-visible{outline-offset:2px;outline:2px solid #93c5fd}#progress-notice:focus-visible{outline-offset:2px;outline:2px solid #93c5fd}#progress-notice{z-index:3;color:#fef3c7;background:#302019;border-color:#b45309;width:max-content;max-width:calc(100% - 16px);font-size:13px;position:fixed;bottom:8px;left:50%;transform:translate(-50%)}#boot-loading{z-index:20;color:#dbeafe;text-align:center;background:radial-gradient(circle at 50% 38%,#2563eb2e,#0000 34%),#060a0f;flex-direction:column;justify-content:center;align-items:center;gap:12px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#boot-loading strong{color:#fff;letter-spacing:0;font-size:22px}#boot-loading span{color:#93c5fd;font-size:13px}#err{color:#f87171;z-index:9999;text-align:center;background:#000000f5;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:40px;font-family:Courier New,monospace;font-size:13px;display:none;position:fixed;top:0;bottom:0;left:0;right:0}#err h2{color:#fca5a5;font-family:sans-serif;font-size:22px}#err pre{white-space:pre-wrap;word-break:break-all;max-width:80vw;line-height:1.6}#err button{color:#fff;cursor:pointer;background:#3b82f6;border:none;border-radius:8px;margin-top:8px;padding:10px 28px;font-size:14px}</style>
    <script type="module" crossorigin src="./assets/index-DC2cZjhf.js"></script>
    <meta name="praesidium-release" content="1.1.0">
  </head>
  <body>
    <canvas id="c" aria-hidden="true"></canvas>
    <div id="game-controls" role="group"></div>
    <div id="battle-status" class="sr-only" role="region" hidden></div>
    <div id="game-reading" class="sr-only" role="region" hidden></div>
    <p id="game-announcement" class="sr-only" role="status"></p>
    <dialog id="challenge-dialog" aria-labelledby="challenge-title">
      <form>
        <h2 id="challenge-title"></h2>
        <label id="challenge-label" for="challenge-code"></label>
        <input id="challenge-code" aria-describedby="challenge-status" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64" />
        <p id="challenge-status" role="status"></p>
        <div class="actions">
          <button id="challenge-close" type="button"></button>
          <button id="challenge-submit" type="submit"></button>
        </div>
      </form>
    </dialog>
    <div id="boot-loading" aria-live="polite">
      <strong>Praesidium</strong>
      <span>Loading defense grid...</span>
    </div>
    <div id="err">
      <h2>⚠ Praesidium crashed</h2>
      <pre id="err-msg">Unknown error</pre>
      <button onclick="location.reload()">Reload</button>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('err');
        var msg = document.getElementById('err-msg');
        if (!el || !msg) return;
        msg.textContent = (e.error && e.error.stack) || e.message || 'Unknown error';
        el.style.display = 'flex';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('err');
        var msg = document.getElementById('err-msg');
        if (!el || !msg) return;
        msg.textContent = (e.reason && e.reason.stack) || String(e.reason) || 'Promise rejected';
        el.style.display = 'flex';
      });
    </script>
  </body>
</html>
